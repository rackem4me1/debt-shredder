[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-shredder-engine"
version = "0.1.0"
description = "Deterministic Debt Shredder engine, frozen specification v2.4"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
debt-shredder-payoff = "payoff_cli:run"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
py-modules = ["SCHEMA", "demo_portfolio", "demo_payoff", "payoff_cli", "payoff_exports"]
packages = ["engine", "dashboard"]

[tool.pytest.ini_options]
pythonpath = [".", "tests/schema"]
testpaths = ["tests"]

[tool.setuptools.package-data]
dashboard = ["setup.js", "restore.js"]
